[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ohr"
version = "0.0.1"
description = "Vendor control protocol for Sennheiser Bluetooth headsets over RFCOMM"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Jaroslaw Fuks" }]
keywords = ["bluetooth", "rfcomm", "headphones", "sennheiser", "gaia"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications",
]

# The core has no dependencies and no platform assumptions. That is deliberate
# and enforced by tests/test_core_is_portable.py — see docs/adr/002.
dependencies = []

[project.optional-dependencies]
# Linux transport backend. Device enumeration goes through BlueZ over D-Bus; the
# RFCOMM socket, SDP resolution and the lease need nothing beyond the standard
# library. Not required, and not importable, on other platforms.
linux = [
    "dbus-python>=1.3; sys_platform == 'linux'",
]
dev = [
    "pytest>=8",
    "jsonschema>=4",
]

[project.scripts]
ohr = "ohr.cli:main"

[project.urls]
Documentation = "https://github.com/jarek102/ohr/tree/main/docs/protocol"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run the suite straight from a clone, without an editable install first.
pythonpath = ["src"]
